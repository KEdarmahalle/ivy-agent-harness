[project]
name = "agent-harness"
version = "0.1.0"
description = "Durable, graph-orchestrated agent harness service with swappable models, tools, MCP servers, and gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "langgraph>=0.2.70",
    "litellm>=1.46.0",
    "mcp>=1.0.0",
    "langfuse>=2.53.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
agent-harness = "harness.cli:main"
agent-harness-nim-smoke = "harness.nim_smoke:main"
ivy = "harness.cli:main"
ivy-nim-smoke = "harness.nim_smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "harness/config.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
